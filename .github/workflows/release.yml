name: Release

# Signing secrets live in the `release` environment, which should only allow
# `v*` tags and require a reviewer. Run this workflow from a version tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Validate a signed, notarized build without creating a release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: meterlark-release
  cancel-in-progress: false

jobs:
  # Tests run without access to any signing secret.
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run tests
        run: swift test -c release --build-system native

  release:
    needs: test
    runs-on: xcode-27
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check version tag
        env:
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$VERIFY_ONLY" != true ]; then
            if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Run from tag v$version (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "::error::Release tags must point to a commit already merged into main"
              exit 1
            }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate and notary key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY SPARKLE_PRIVATE_KEY; do
            test -n "${!name}" || { echo "::error::Missing secret $name in the release environment"; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign only finds identities in keychains on the user search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          test -n "$identity" || { echo "::error::APPLE_CERTIFICATE holds no valid Developer ID Application identity"; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          sparkle_key_path="$RUNNER_TEMP/sparkle-private-key"
          (umask 077; printf '%s\n' "$SPARKLE_PRIVATE_KEY" > "$sparkle_key_path")
          {
            echo "SIGN_IDENTITY=$identity"
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key_path"
            echo "SPARKLE_PRIVATE_KEY_FILE=$sparkle_key_path"
          } >> "$GITHUB_ENV"
          echo "Signing as: $identity"

      - name: Package, sign and notarize
        run: |
          ./scripts/package-app.sh
          ./scripts/package-dmg.sh
          ./scripts/package-update-feed.sh

      - name: Create draft release
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="Meterlark-$VERSION-arm64"
          (cd dist && shasum -a 256 "$base.dmg" > "$base.dmg.sha256" && shasum -a 256 "$base.zip" > "$base.zip.sha256")
          gh release create "v$VERSION" "dist/$base.dmg" "dist/$base.dmg.sha256" "dist/$base.zip" "dist/$base.zip.sha256" "dist/appcast.xml" \
            --draft --verify-tag --title "Meterlark $VERSION" --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "${APPLE_API_KEY_PATH:-}"
          rm -f "$RUNNER_TEMP/sparkle-private-key"
