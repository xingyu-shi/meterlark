name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public content
        run: python3 scripts/check-public-content.py
      - name: Test update feed metadata
        run: python3 -m unittest discover -s Tests/Packaging -v
      - name: Scan Git history for credentials
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact=100 --no-banner
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test -c release --build-system native
      - name: Verify release package and linked SDK
        run: ./scripts/package-app.sh
      - name: Verify drag-to-install disk image
        run: ./scripts/package-dmg.sh
